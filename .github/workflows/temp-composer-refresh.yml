name: Temporary Composer security refresh

on:
  push:
    branches:
      - chore/security-update-critipixel-2026-10
    paths:
      - "composer.json"
      - ".github/workflows/temp-composer-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: critipixel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgresql://postgres:root@127.0.0.1:5432/critipixel_test?serverVersion=17&charset=utf8"
      APP_ENV: test
      SYMFONY_DEPRECATIONS_HELPER: 999999
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo_pgsql
          coverage: xdebug
          tools: composer:v2
          ini-values: date.timezone=Europe/Paris

      - name: Audit previous lock for comparison
        run: composer audit --locked || true

      - name: Update supported Symfony components
        run: composer update "symfony/*" --with-all-dependencies --no-interaction --no-progress --no-scripts

      - name: Validate Composer files
        run: composer validate --no-check-publish
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            sleep 1
          done

      - name: Create test database and schema
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src tests --memory-limit=512M

      - name: Commit refreshed lock for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current"
          else
            git add composer.lock
            git commit -m "chore: refresh Symfony dependencies"
            git push origin HEAD
          fi

      - name: Require a clean security audit
        run: composer audit --locked
